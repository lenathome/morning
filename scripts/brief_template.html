<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morning brief</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-width header (date and title, goals strip, then the pill row that doubles as the tab bar; the
   pill row sticks while scrolling), then one tab panel at a time, then dense rows with a fixed-width number column
   so numbers can be read back. The page is at most 1240px wide. On the To do tab, from 1100px wide, the to-do
   content sits on the left (3fr) and the In progress list is pinned on the right (2fr); with no in-progress items
   the to-do content takes the full width. Below 1100px it is one column with In progress first. Every other tab is
   a single full-width panel. */
:root {
  --bg: #f4f6f4;
  --surface: #ffffff;
  --surface-2: #eaeeea;
  --fg: #1d2622;
  --muted: #5c6b64;
  --line: #d6dcd7;
  --accent: #1f6b52;
  --accent-soft: #dcece4;
  --good: #1f7a4d;
  --good-soft: #d9efe2;
  --bad: #b3261e;
  --bad-soft: #f8dcd9;
  --warn: #8a5a00;
  --warn-soft: #f6e8c6;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131a17;
    --surface: #1b2420;
    --surface-2: #232e29;
    --fg: #e6ece8;
    --muted: #9aaba2;
    --line: #2f3c36;
    --accent: #5fc79f;
    --accent-soft: #1d3a2f;
    --good: #5fc79f;
    --good-soft: #1d3a2f;
    --bad: #ff8a80;
    --bad-soft: #4a2320;
    --warn: #f0c36a;
    --warn-soft: #43360f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131a17;
  --surface: #1b2420;
  --surface-2: #232e29;
  --fg: #e6ece8;
  --muted: #9aaba2;
  --line: #2f3c36;
  --accent: #5fc79f;
  --accent-soft: #1d3a2f;
  --good: #5fc79f;
  --good-soft: #1d3a2f;
  --bad: #ff8a80;
  --bad-soft: #4a2320;
  --warn: #f0c36a;
  --warn-soft: #43360f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-inline: 16px;
  padding-block: 20px 48px;
  overflow-wrap: anywhere;
}
.wrap { max-width: 1240px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.tabpanel { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
/* To do tab: In progress comes first in the markup, so it leads on narrow screens; from 1100px it moves to the right. */
.todo-cols { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.todo-main, .todo-side { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.muted { color: var(--muted); }

/* header */
header { display: flex; flex-direction: column; gap: 10px; }
.date { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.focus { font-family: var(--font-display); font-weight: 500; font-size: 26px; line-height: 1.2; margin: 0; text-wrap: balance; }
.banner { background: var(--surface-2); color: var(--muted); border-radius: 8px; padding: 8px 12px; font-size: 13px; display: flex; flex-direction: column; gap: 2px; }

/* seasonal photo: a fixed-height layer behind the header that fades into the page colour.
   Only present when the renderer embedded a photo (body.has-bg). Cards keep solid backgrounds. */
body { position: relative; margin: 0; }
.wrap { position: relative; z-index: 1; }
.bg-hero { position: absolute; top: 0; left: 0; right: 0; height: 420px; overflow: hidden; z-index: 0; pointer-events: none; }
.bg-photo { position: absolute; inset: 0; background-size: cover; background-position: center; background-repeat: no-repeat; }
.bg-hero::before { content: ""; position: absolute; inset: 0; z-index: 1; background: var(--bg); opacity: 0.35; }
.bg-hero::after { content: ""; position: absolute; inset: 0; z-index: 2; background: linear-gradient(to bottom, transparent 35%, var(--bg) 100%); }
body.has-bg header {
  background: color-mix(in srgb, var(--bg) 62%, transparent);
  border-radius: 10px; padding: 12px 14px;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
body.has-bg .date { color: var(--fg); text-shadow: 0 1px 6px var(--bg); }
body.has-bg .focus { text-shadow: 0 1px 8px var(--bg); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .bg-photo { filter: brightness(0.55); }
}
:root[data-theme="dark"] .bg-photo { filter: brightness(0.55); }
@media (max-width: 600px) {
  .bg-hero { height: 300px; }
}

/* pills: the only navigation. Each pill is a tab; the row sticks to the top while scrolling. */
.chips {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2;
  background: var(--bg); border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; gap: 8px;
  margin-inline: -16px; padding: 8px 16px 10px;
}
.chip {
  display: inline-flex; align-items: baseline; gap: 6px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 12px; cursor: pointer; font-size: 13px; white-space: nowrap;
}
.chip:hover { border-color: var(--accent); }
.chip[aria-selected="true"] { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
.chip b { font-family: var(--font-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.chip .overdue { color: var(--bad); font-weight: 600; }

/* sections and rows */
section.group { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
h2 { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0; display: flex; gap: 8px; align-items: baseline; }
h2 .count { font-family: var(--font-mono); font-weight: 400; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.parent { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); padding: 10px 12px 2px 56px; }
.row { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 8px; padding: 8px 12px; align-items: baseline; }
.row + .row, .parent { border-top: 1px solid var(--line); }
.parent + .row { border-top: 0; }
.num { font-family: var(--font-mono); font-weight: 500; font-size: 13px; color: var(--accent); text-align: right; font-variant-numeric: tabular-nums; }
.rowbody { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 12.5px; color: var(--muted); }
.due-overdue { color: var(--bad); font-weight: 600; }
.due-today { color: var(--warn); font-weight: 600; }
.tag { font-family: var(--font-mono); font-size: 11.5px; background: var(--surface-2); color: var(--muted); border-radius: 4px; padding: 1px 6px; }

/* live overlay: a row or card marked done (or a parked PR) collapses to its tick box, number and a struck-through,
   muted title. Everything else in it is hidden, and the script moves it below the open items of its section under a
   "Done (N)" label. Colours come from the tokens, so it reads in light and dark. */
.updated { font-size: 12.5px; color: var(--muted); }
.row.done, .card.done { color: var(--muted); }
.done .num { color: var(--muted); }
.row.done .rowbody > :first-child, .row.done a, .card.done .prtitle a { text-decoration: line-through; color: var(--muted); }
.done .due-overdue, .done .due-today { color: var(--muted); font-weight: 400; }
.row.done .rowbody > :not(:first-child), .card.done .rowbody > :not(:first-child), .card.done > .meta,
.card.done .prtitle > :not(a) { display: none; }
.donehead { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); padding: 10px 12px 2px 56px; border-top: 1px solid var(--line); }
.donehead + .row { border-top: 0; }
.panel > .donehead:first-child { border-top: 0; }
.cards > .donehead { border-top: 0; padding: 6px 2px 0; }
.ticks .panel .donehead { padding-left: 74px; }
/* tick boxes: shown only once the page can write. The box sits just before the number, so the number column widens. */
.numcell { display: flex; justify-content: flex-end; align-items: center; gap: 6px; }
.tick { flex: none; margin: 0; width: 14px; height: 14px; accent-color: var(--accent); cursor: pointer; }
.tick:disabled { cursor: default; opacity: 0.6; }
.ticks .row, .ticks .testrow { grid-template-columns: 58px minmax(0, 1fr); }
.ticks .parent { padding-left: 74px; }

/* prs */
.cards { display: flex; flex-direction: column; gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.prtitle { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.poke { font-size: 12px; background: var(--warn-soft); color: var(--warn); border-radius: 4px; padding: 1px 6px; font-weight: 600; }

/* testing */
.testrow { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 8px; align-items: baseline; }
.live { font-size: 12.5px; font-weight: 600; border-radius: 4px; padding: 1px 6px; align-self: flex-start; }
.live.good { background: var(--good-soft); color: var(--good); }
.live.warn { background: var(--warn-soft); color: var(--warn); }
.steps { margin: 0; padding-left: 20px; font-size: 13.5px; display: flex; flex-direction: column; gap: 2px; }
/* triage (product-os#5 trial): the triage beside Lena's own steps from 900px, below them on a phone */
.testcols { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
@media (min-width: 900px) { .testcols.has-triage { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 16px; align-items: start; } }
.colhead { font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
.triage { display: flex; flex-direction: column; gap: 6px; min-width: 0; border-left: 3px solid var(--accent-soft); padding-left: 10px; }
.triage .pills { display: flex; flex-wrap: wrap; gap: 4px 6px; }
.tpill { font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 1px 8px; background: var(--surface-2); color: var(--muted); }
.tpill.good { background: var(--good-soft); color: var(--good); }
.tpill.warn { background: var(--warn-soft); color: var(--warn); }
.tpill.bad { background: var(--bad-soft); color: var(--bad); }
.tgroup { border-top: 1px solid var(--line); padding-top: 6px; }
.tgroup > summary { cursor: pointer; font-size: 13px; font-weight: 600; }
.slabel { font-size: 11.5px; font-weight: 600; color: var(--muted); }
.trialbanner { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-weight: 600; font-size: 13.5px; }

/* meetings */
.mtime { font-family: var(--font-mono); font-size: 13px; color: var(--accent); }
.card h3 { font-size: 15px; margin: 0; font-weight: 600; }
.plist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 1px; font-size: 13.5px; }
.nlist { margin: 0; padding-left: 18px; font-size: 13.5px; }

/* projects */
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filter { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
.filter[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); font-weight: 600; }
details.prow > summary { cursor: pointer; list-style: none; display: grid; grid-template-columns: minmax(0, 1fr) 20px; gap: 8px; align-items: start; padding: 10px 12px; }
details.prow > summary::-webkit-details-marker { display: none; }
.prow + .prow { border-top: 1px solid var(--line); }
.psum { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.pnext { font-size: 13.5px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
details.prow[open] .pnext { display: block; -webkit-line-clamp: unset; line-clamp: unset; overflow: visible; }
.chev { width: 20px; height: 20px; position: relative; margin-top: 1px; }
.chev::before {
  content: ""; position: absolute; left: 6px; top: 4px; width: 7px; height: 7px;
  border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg);
}
details.prow[open] .chev::before { transform: rotate(45deg); top: 3px; }
details.prow > summary:hover .chev::before { border-color: var(--accent); }
details.prow > summary:focus-visible { outline-offset: -2px; border-radius: 8px; }
/* Waiting for others: folded by default, one line when shut */
details.group > summary { cursor: pointer; list-style: none; display: flex; gap: 8px; align-items: center; min-width: 0; }
details.group > summary::-webkit-details-marker { display: none; }
details.group > summary h2 { flex-wrap: wrap; min-width: 0; }
details.group > summary:hover .chev::before { border-color: var(--accent); }
details.group > summary:focus-visible { outline-offset: 2px; border-radius: 6px; }
details.group[open] .chev::before { transform: rotate(45deg); top: 3px; }
details.group > .panel { margin-top: 8px; }
.group-sum .tochase { text-transform: none; letter-spacing: 0; font-weight: 400; }
.prows { overflow: hidden; }
details.prow .detail { margin: 0 12px 10px; }
.phead { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.pname { font-weight: 600; }
.pill { font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 1px 8px; text-transform: lowercase; }
.pill.active { background: var(--good-soft); color: var(--good); }
.pill.blocked { background: var(--bad-soft); color: var(--bad); }
.pill.waiting { background: var(--warn-soft); color: var(--warn); }
a.pill { text-decoration: none; }
a.pill:hover { text-decoration: underline; }
.pill.other { background: var(--surface-2); color: var(--muted); }
.pill.needs-lena { background: var(--warn-soft); color: var(--warn); text-transform: none; }
.pill.split { background: var(--accent-soft); color: var(--accent); text-transform: none; }
.pill.handoff { background: var(--good-soft); color: var(--good); text-transform: none; }
.why { font-size: 12.5px; color: var(--muted); font-style: italic; }
.detail { display: flex; flex-direction: column; gap: 6px; padding-top: 8px; margin-top: 8px; border-top: 1px solid var(--line); font-size: 13.5px; }
.detail p { margin: 0; }
.detail ul { margin: 0; padding-left: 18px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: 13.5px; }
th { text-align: left; font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.nextcol { min-width: 160px; }
tr:last-child td { border-bottom: 0; }
.empty { color: var(--muted); padding: 24px 0; }

/* goals strip: context under the header, not numbered. Rows reuse the project row styles. */
.goals h2 { flex-wrap: wrap; }
.goals .pill.draft { background: var(--warn-soft); color: var(--warn); text-transform: none; letter-spacing: 0; }
.goals .detail p.glabel { font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
/* over a seasonal photo (body.has-bg), the heading gets a soft panel so it stays legible */
body.has-bg .goals > h2 {
  align-self: flex-start; color: var(--fg); border-radius: 6px; padding: 4px 8px;
  background: color-mix(in srgb, var(--bg) 72%, transparent);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}

@media (prefers-reduced-motion: no-preference) {
  .chip, .filter { transition: border-color 0.12s, background 0.12s; }
}
@media (max-width: 420px) {
  .focus { font-size: 22px; }
}
@media (min-width: 1100px) {
  body { padding-inline: 24px; }
  .chips { margin-inline: 0; padding-inline: 0; }
  .todo-cols.has-side { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 28px; align-items: start; }
  .todo-cols.has-side .todo-main { grid-column: 1; grid-row: 1; }
  .todo-cols.has-side .todo-side { grid-column: 2; grid-row: 1; position: sticky; top: 68px; max-height: calc(100vh - 84px); overflow-y: auto; }
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script id="bg-data" type="application/json">/*__BG__*/null</script>
<script id="brief-data" type="application/json">/*__BRIEF_JSON__*/null</script>
<script>
(function () {
  "use strict";

  function el(tag, props, children) {
    var node = document.createElement(tag);
    if (props) {
      for (var k in props) {
        if (k === "class") node.className = props[k];
        else if (k === "text") node.textContent = props[k];
        else if (k.slice(0, 2) === "on") node.addEventListener(k.slice(2), props[k]);
        else node.setAttribute(k, props[k]);
      }
    }
    (children || []).forEach(function (c) {
      if (c == null || c === false) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  }
  function span(cls, text) { return el("span", { "class": cls, text: text }); }
  function link(href, text) {
    return el("a", { href: href, target: "_blank", rel: "noopener noreferrer", text: text });
  }
  function safeUrl(u) { return /^https?:\/\//i.test(String(u || "")) ? u : "#"; }

  var app = document.getElementById("app");
  /* Seasonal photo: a data: URI string, or null when the renderer had none. */
  var bgUri = null;
  try { bgUri = JSON.parse(document.getElementById("bg-data").textContent); } catch (e) { bgUri = null; }
  if (typeof bgUri === "string" && /^data:/i.test(bgUri)) {
    var photo = el("div", { "class": "bg-photo" });
    photo.style.backgroundImage = "url(" + JSON.stringify(bgUri) + ")";
    document.body.insertBefore(el("div", { "class": "bg-hero", "aria-hidden": "true" }, [photo]), app);
    document.body.classList.add("has-bg");
  }
  var brief = null;
  try { brief = JSON.parse(document.getElementById("brief-data").textContent); } catch (e) { brief = null; }
  if (!brief) {
    app.appendChild(el("p", { "class": "empty", text: "No brief data in this page." }));
    return;
  }

  function groupItems(groups) {
    return (groups || []).reduce(function (a, g) { return a.concat(g.items || []); }, []);
  }
  function countGroups(groups) { return groupItems(groups).length; }
  /* The live overlay marks items and PRs `done`; section and pill counts only count what is still open. */
  function openCount(list) { return (list || []).filter(function (x) { return !x.done; }).length; }
  function openInGroups(groups) { return openCount(groupItems(groups)); }
  /* Done items collapse to one line and sit after the open ones, under a small "Done (N)" label. The builders call
     these on every render, so a tick, an untick and the 30-second refresh all regroup. Numbers are never touched. */
  function doneHead(count) { return el("div", { "class": "donehead", text: "Done (" + count + ")" }); }
  function splitDone(list) {
    return { open: (list || []).filter(function (x) { return !x.done; }), done: (list || []).filter(function (x) { return x.done; }) };
  }
  /* `into` is a panel or a card list: open items in their order, then the label and the done items. */
  function appendWithDone(into, list, build) {
    var s = splitDone(list);
    s.open.forEach(function (x) { into.appendChild(build(x)); });
    if (s.done.length) into.appendChild(doneHead(s.done.length));
    s.done.forEach(function (x) { into.appendChild(build(x)); });
    return into;
  }

  /* Everything the tabs show comes from these values. derive() sets them from a brief, so the page can be rebuilt
     from the original brief plus the latest overlay without reloading. */
  var inProgress, urgent, prs, actions, todos, ideas, meetings, projects, partners, yours, waiting, testing, docsDrift;
  var urgentItems, overdue, prTotal;
  var ticking = false;        /* true once the db is available: numbered items then get a tick box */
  function derive(d) {
    inProgress = d.in_progress || [];
    urgent = d.urgent || [];
    prs = d.prs || {};
    actions = d.actions || {};
    todos = d.todos || {};
    ideas = d.ideas || {};
    meetings = d.meetings || [];
    projects = d.projects || [];
    partners = d.partners || [];
    yours = actions.yours || [];
    waiting = d.waiting || [];
    testing = d.testing || [];
    docsDrift = d.docs_drift || [];
    urgentItems = groupItems(urgent);
    overdue = urgentItems.filter(function (i) { return !i.done && String(i.due || "").indexOf("overdue") === 0; }).length;
    prTotal = openCount(prs.review_requested) + openCount(prs.ready) + openCount(prs.awaiting);
  }
  derive(brief);

  /* ---------- builders ---------- */
  /* The number, with a tick box before it when the page can write. A tick this page wrote itself (`undo`) can be
     unticked; any other done item is already recorded, so its box is checked and disabled. */
  function numCell(n, done, undo) {
    var num = span("num", String(n));
    if (!ticking) return num;
    var box = el("input", { type: "checkbox", "class": "tick", "data-n": String(n), "aria-label": "Mark " + n + " done" });
    box.checked = !!done;
    if (done && !undo) {
      box.disabled = true;
      box.setAttribute("title", "Already recorded, so it can't be unticked here");
    } else {

        el("td", {}, [statusPill(x.status)]), el("td", { "class": "nextcol", text: x.next || "" }),
        el("td", { text: x.target || "" })]);
    });
    var table = el("table", {}, [
      el("thead", {}, [el("tr", {}, ["Partner", "Owner", "Status", "Next", "Target"].map(function (h) { return el("th", { text: h }); }))]),
      el("tbody", {}, rows)
    ]);
    return [section("Partners - next actions", partners.length, el("div", { "class": "panel tablewrap" }, [table]))];
  }

  /* The To do pill counts what is still open on its tab, In progress included, at every width. Waiting items are
     not counted: they wait on someone else. Built on each render, because the counts change with the overlay. */
  function tabs() {
    return [
      { id: "todo", label: "To do", build: todoTab, empty: "Nothing to do.",
        count: openCount(inProgress) + openCount(urgentItems) + openInGroups(todos.coming_up) + openCount(yours) +
               meetings.length },
      { id: "prs", label: "PRs", build: prsTab, count: prTotal, empty: "No pull requests need you." },
      { id: "testing", label: "Testing", build: testingTab, count: openCount(testing) + docsDrift.length,
        empty: "Nothing merged recently that needs a manual test." },
      { id: "ideas", label: "Ideas bank", build: ideasTab,
        count: openInGroups(ideas.strategic) + openInGroups(ideas.other), empty: "No ideas parked." },
      { id: "projects", label: "Projects", build: projectsTab, count: projects.length, empty: "No projects." },
      { id: "clients", label: "Clients", build: clientsTab, count: partners.length, empty: "No clients." }
    ];
  }

  /* ---------- header: date and title, goals strip, then the pill row ---------- */
  var updatedEl = el("div", { "class": "updated", role: "status", hidden: "" });
  var saveEl = el("div", { "class": "updated", role: "status", hidden: "" });   /* "Couldn't save the tick on 12" */
  var header = el("header", {}, [
    el("div", { "class": "date", text: brief.weekday_label || brief.date }),
    el("h1", { "class": "focus", text: "Morning brief" }),
    updatedEl,
    saveEl
  ]);
  app.appendChild(header);
  if ((brief.unavailable || []).length) {
    header.appendChild(el("div", { "class": "banner", role: "status" },
      brief.unavailable.map(function (u) { return el("div", { text: u }); })));
  }
  var goalsNode = goalsBlock(brief.goals);
  if (goalsNode) header.appendChild(goalsNode);

  /* ---------- pills: one per tab, and the only tab bar ---------- */
  /* Each pill carries its tab's label and count; To do also shows the overdue figure. A tab with nothing in it gets
     no pill, except To do, which always shows. A tab that was there at load stays after a live update, even at 0, so
     the row does not jump. renderTabs() builds the new bar and panels first and swaps them in last, so a failure
     while building leaves the page as it was. */
  var tablist = null;
  var panels = {};
  var tabButtons = {};
  var visibleIds = [];
  var shownAtLoad = null;
  var current = "todo";
  function renderTabs() {
    var keep = shownAtLoad || {};
    var nList = el("div", { "class": "chips", role: "tablist", "aria-label": "Brief sections" });
    var nPanels = {}, nButtons = {}, nIds = [];
    tabs().forEach(function (t) {
      var content = t.build();
      if (!content.length && t.id !== "todo" && !keep[t.id]) return;
      nIds.push(t.id);
      var b = el("button", { "class": "chip", role: "tab", type: "button", id: "tab-" + t.id,
        "aria-controls": "panel-" + t.id, "aria-selected": "false",
        onclick: function () { select(t.id, true); } }, [
        span("", t.label), el("b", { text: String(t.count) }),
        t.id === "todo" && overdue > 0 ? span("overdue", overdue + " overdue") : null
      ]);
      nButtons[t.id] = b;
      nList.appendChild(b);
      nPanels[t.id] = el("div", { "class": "tabpanel", role: "tabpanel", id: "panel-" + t.id, "aria-labelledby": "tab-" + t.id, hidden: "" },
        content.length ? content : [el("p", { "class": "empty", text: t.empty })]);
    });
    nList.addEventListener("keydown", onTabKey);

    /* what the reader had: scroll position, a focused pill, opened <details> */
    var scrollY = window.scrollY;
    var focusId = document.activeElement && /^tab-/.test(document.activeElement.id || "") ? document.activeElement.id : null;
    var opened = {};
    visibleIds.forEach(function (id) {
      Array.prototype.forEach.call(panels[id].querySelectorAll("details"), function (d, i) {
        if (d.open) (opened[id] = opened[id] || []).push(i);
      });
    });
    if (tablist && tablist.parentNode) tablist.parentNode.removeChild(tablist);
    visibleIds.forEach(function (id) { if (panels[id].parentNode) panels[id].parentNode.removeChild(panels[id]); });

    tablist = nList; panels = nPanels; tabButtons = nButtons; visibleIds = nIds;
    if (!shownAtLoad) { shownAtLoad = {}; nIds.forEach(function (id) { shownAtLoad[id] = true; }); }
    app.appendChild(tablist);
    visibleIds.forEach(function (id) { app.appendChild(panels[id]); });
    Object.keys(opened).forEach(function (id) {
      if (!panels[id]) return;
      var ds = panels[id].querySelectorAll("details");
      opened[id].forEach(function (i) { if (ds[i]) ds[i].open = true; });
    });
    select(current, false);
    if (scrollY && window.scrollY !== scrollY) window.scrollTo(0, scrollY);
    if (focusId && document.getElementById(focusId)) document.getElementById(focusId).focus();
  }

  function select(id, scrollUp) {
    if (visibleIds.indexOf(id) < 0) id = "todo";
    current = id;
    visibleIds.forEach(function (tid) {
      var on = tid === id;
      panels[tid].hidden = !on;
      tabButtons[tid].setAttribute("aria-selected", String(on));
      tabButtons[tid].tabIndex = on ? 0 : -1;
    });
    try { localStorage.setItem("morning-brief-tab", id); } catch (e) { /* storage unavailable */ }
    if (scrollUp && tablist.getBoundingClientRect().top < 0) tablist.scrollIntoView({ block: "start" });
  }
  function onTabKey(e) {
    var cur = visibleIds.indexOf(document.activeElement && document.activeElement.id.replace("tab-", ""));
    if (cur < 0) return;
    var next = e.key === "ArrowRight" ? cur + 1 : e.key === "ArrowLeft" ? cur - 1 : null;
    if (next == null) return;
    next = (next + visibleIds.length) % visibleIds.length;
    select(visibleIds[next], false);
    tabButtons[visibleIds[next]].focus();
    e.preventDefault();
  }

  try { current = localStorage.getItem("morning-brief-tab") || "todo"; } catch (e) { current = "todo"; }
  renderTabs();

  /* ---------- live overlay ---------- */
  /* Claude writes what changed since the page was published to the doc brief-updates/<date>: item numbers marked
     done or started, a changed due date, note or tag, and parked PRs. The page also writes one thing: a tick on a
     numbered item, items[<n>] = {status: "done" | "open", by: "page", at}. Claude syncs the page ticks to Notion
     and the local done-lists at the next /morning run, then sets synced_at on them. The overlay is data, never
     followed: each field is type-checked, unknown numbers and fields are ignored, and everything is shown with
     textContent. The overlay is always applied to a fresh copy of the original brief, never to the last result. */
  var ITEM_HOMES = ["progress", "urgent", "coming", "yours", "waiting", "testing", "ideas"];
  /* waiting items cannot be started: they wait on someone else */
  var STARTABLE = { urgent: 1, coming: 1, yours: 1, ideas: 1 };
  function cleanTag(t) {
    t = obj(t);
    if (["needs-lena", "split", "handoff"].indexOf(t.verdict) < 0) return null;
    var who = t.who == null ? "" : t.who, why = t.why == null ? "" : t.why;
    if (typeof who !== "string" || typeof why !== "string") return null;
    if (t.verdict !== "needs-lena" && !who.trim()) return null;
    return { verdict: t.verdict, who: who, why: why };
  }
  function applyOverlay(base, ov) {
    var d = JSON.parse(JSON.stringify(base));
    d.in_progress = arr(d.in_progress);
    d.urgent = arr(d.urgent);
    d.todos = obj(d.todos); d.todos.coming_up = arr(d.todos.coming_up);
    d.actions = obj(d.actions); d.actions.yours = arr(d.actions.yours);
    d.waiting = arr(d.waiting);
    d.testing = arr(d.testing);
    d.docs_drift = arr(d.docs_drift);
    d.ideas = obj(d.ideas); d.ideas.strategic = arr(d.ideas.strategic); d.ideas.other = arr(d.ideas.other);
    d.prs = obj(d.prs);

    /* every list an item can sit in, by where it lives */
    function groupLists(gs) { return gs.map(function (g) { return obj(g).items; }).filter(Array.isArray); }
    function listsFor(home) {
      if (home === "progress") return [d.in_progress];
      if (home === "urgent") return groupLists(d.urgent);
      if (home === "coming") return groupLists(d.todos.coming_up);
      if (home === "yours") return [d.actions.yours];
      if (home === "waiting") return [d.waiting];
      if (home === "testing") return [d.testing];
      return groupLists(d.ideas.strategic).concat(groupLists(d.ideas.other));
    }
    var index = {};
    ITEM_HOMES.forEach(function (home) {
      listsFor(home).forEach(function (list) {
        list.forEach(function (i) { if (i && typeof i.n === "number") index[i.n] = { item: i, home: home }; });
      });
    });

    var changes = obj(ov.items);
    var started = [];
    Object.keys(changes).filter(function (k) { return /^\d+$/.test(k) && index[k]; })
      .sort(function (a, b) { return a - b; })
      .forEach(function (k) {
        var rec = obj(changes[k]), hit = index[k], item = hit.item;
        if (hit.home !== "testing") {
          if (typeof rec.due === "string") item.due = rec.due;
          if (typeof rec.note === "string") item.note = rec.note;
          var tag = cleanTag(rec.tag);
          if (tag) item.tag = tag;
        }
        /* status "open" is not done: the item stays as the brief has it. A done record the page wrote itself and
           Claude has not yet synced (no synced_at) can still be unticked, so the row builder is told. */
        if (rec.status === "done") {
          item.done = true;
          if (rec.by === "page" && !rec.synced_at) item.tick_undo = true;
        }
        else if (rec.status === "chased" && hit.home === "waiting") { item.chase = false; item.chased_today = true; }
        else if (rec.status === "started" && STARTABLE[hit.home]) started.push(hit);
      });
    /* started: out of its section, onto the end of In progress, same number. The row builder follows `kind`. */
    started.forEach(function (hit) {
      listsFor(hit.home).forEach(function (list) {
        var at = list.indexOf(hit.item);
        if (at >= 0) list.splice(at, 1);
      });
      if (hit.home === "yours") hit.item.kind = "fathom";
      else if (hit.home !== "waiting") hit.item.kind = "notion";
      d.in_progress.push(hit.item);
    });

    /* a parked PR is shown the way a done item is */
    var parked = obj(ov.prs);
    ["review_requested", "ready", "awaiting"].forEach(function (k) {
      arr(d.prs[k]).forEach(function (pr) {
        if (pr && Object.prototype.hasOwnProperty.call(parked, pr.url) && obj(parked[pr.url]).status === "parked") pr.done = true;
      });
    });
    return d;
  }
  /* The newest `at` among the overlay's records, as "Updated HH:MM" in the reader's local time; "" if there is none. */
  function updatedText(ov) {
    var best = 0, any = false;
    [obj(ov.items), obj(ov.prs)].forEach(function (m) {
      Object.keys(m).forEach(function (k) {
        if (!m[k] || typeof m[k] !== "object") return;
        any = true;
        var t = typeof m[k].at === "string" ? Date.parse(m[k].at) : NaN;
        if (!isNaN(t) && t > best) best = t;
      });
    });
    if (!any || !best) return "";
    var when = new Date(best);
    function two(x) { return (x < 10 ? "0" : "") + x; }
    return "Updated " + two(when.getHours()) + ":" + two(when.getMinutes());
  }

  var shown = brief;          /* the data the page is showing now: the last good state */
  var lastOverlay = "{}";     /* JSON of the overlay behind it; the built brief counts as an empty overlay */
  function showOverlay(ov, json) {
    var next = applyOverlay(brief, ov);
    derive(next);
    try { renderTabs(); } catch (e) { derive(shown); throw e; }
    shown = next;
    lastOverlay = json;
    var text = updatedText(ov);
    updatedEl.textContent = text;
    updatedEl.hidden = !text;
  }

  /* ---------- ticks ---------- */
  /* serverOv is the last overlay read from the db. pending holds this page's own ticks that are not yet confirmed
     by a read: {rec, state}, state "queued" (waiting for, or in, its write) or "saved" (written, awaiting a read
     that started after the write). They are laid over serverOv on every paint, so a poll cannot undo a tick. */
  var serverOv = {};
  var pending = {};
  function mergePending(ov) {
    var out = {}, items = {}, src = obj(ov.items);
    Object.keys(ov).forEach(function (k) { out[k] = ov[k]; });
    Object.keys(src).forEach(function (k) { items[k] = src[k]; });
    Object.keys(pending).forEach(function (n) {
      var m = {}, base = obj(items[n]), rec = pending[n].rec;
      Object.keys(base).forEach(function (k) { m[k] = base[k]; });
      Object.keys(rec).forEach(function (k) { m[k] = rec[k]; });
      items[n] = m;
    });
    out.items = items;
    return out;
  }
  function paint() {
    var ov = mergePending(serverOv);
    var json = JSON.stringify(ov) + (ticking ? "|ticks" : "");
    if (json !== lastOverlay) showOverlay(ov, json);
  }
  function saveNote(text) { saveEl.textContent = text; saveEl.hidden = !text; }

  /* One write to the doc at a time, in the order of the clicks. A failed write is not retried: the item goes back
     to what the db says and a short note appears next to "Updated". */
  var writeChain = Promise.resolve();
  function writeTick(n, rec) {
    var items = {};
    items[n] = rec;
    return overlayDoc.get().then(function (snap) {
      if (snap && snap.exists) return overlayDoc.update({ items: items });
      return overlayDoc.set({ date: brief.date, items: items, prs: {} });
    });
  }
  function tickItem(n, on, hadFocus) {
    if (!ticking || !overlayDoc) return;
    var entry = { rec: { status: on ? "done" : "open", by: "page", at: new Date().toISOString() }, state: "queued" };
    pending[n] = entry;
    writeChain = writeChain.then(function () { return writeTick(n, entry.rec); }).then(function () {
      entry.state = "saved";
      saveNote("");
      return readOverlay(true);
    }, function () {
      if (pending[n] === entry) delete pending[n];
      saveNote("Couldn't save the tick on " + n);
      try { paint(); } catch (e) { /* keep the last good state */ }
    });
    try { paint(); } catch (e) { /* keep the last good state */ }
    if (hadFocus) {
      var again = document.querySelector('.tick[data-n="' + n + '"]');
      if (again && again.focus) again.focus();
    }
  }

  /* Poll while the page is visible; no db or doc, or a failed read, keeps the last good state and stays quiet.
     Once the doc ref exists the page can write, so it re-renders with the tick boxes. */
  var overlayDoc = null, readRun = null;
  function doRead() {
    var settled = Object.keys(pending).filter(function (n) { return pending[n].state === "saved"; })
      .map(function (n) { return { n: n, entry: pending[n] }; });
    var ok = false;
    return Promise.resolve().then(function () {
      if (overlayDoc) return null;
      return window.claude.use("db").then(function (db) {
        if (db) overlayDoc = db.doc("brief-updates/" + String(brief.date).replace(/[^0-9-]/g, ""));
      });
    }).then(function () {
      if (!overlayDoc) return null;
      if (!ticking) { ticking = true; document.body.classList.add("ticks"); }
      return overlayDoc.get().catch(function () { return null; });
    }).then(function (snap) {
      var data = snap && snap.exists ? snap.data() : null;
      if (!data || typeof data !== "object" || Array.isArray(data)) { ok = !!snap; return; }
      serverOv = data;
      ok = true;
    }).then(function () {
      /* a tick written before this read began is now in what was read, so it no longer needs laying over it */
      if (ok) settled.forEach(function (s) { if (pending[s.n] === s.entry) delete pending[s.n]; });
      paint();
    }).catch(function () { /* keep the last good state */ });
  }
  /* A forced read (after a write) waits for one already in flight and then reads again, so it sees the write. */
  function readOverlay(force) {
    if (readRun) return force ? readRun.then(function () { return readOverlay(true); }) : readRun;
    readRun = doRead().then(function () { readRun = null; });
    return readRun;
  }
  function pollOverlay() { if (document.visibilityState === "visible") readOverlay(); }
  if (window.claude && typeof window.claude.use === "function") {
    readOverlay();
    setInterval(pollOverlay, 30000);
    document.addEventListener("visibilitychange", pollOverlay);
  }
})();
</script>
</body>
</html>
