# ~/morning/config.yaml template.
# Copy this file to ~/morning/config.yaml and fill in real values.
# The real config.yaml is gitignored.

notion:
  # 32-character hex ID for the Notion database holding tasks.
  # This DB is created in Task 3 Step 3 (via Notion MCP) — the ID is captured
  # there and substituted into the live ~/morning/config.yaml.
  # See the spec: the existing "To Do" page is unstructured notes; this is a
  # new database for actionable tasks only.
  todo_database_id: "REPLACE_WITH_NOTION_DB_ID"

  # Property names on the new Notion Tasks DB. These match the schema created
  # in Task 3 Step 3. Edit ONLY if you rename properties in Notion.
  property_names:
    title: "Name"
    due_date: "Due"
    status: "Status"
    category: "Category"
    type: "Type"
    client: "Client"
    area: "Area"

  # The category value that promotes a task into the "Strategic" bucket.
  # All other category values are treated as Operational/Other for bucketing.
  strategic_category: "Strategic"

calendar:
  # Any attendee whose email does NOT end with this domain is treated as external.
  ekko_email_domain: "@ekko.earth"
  # Primary calendar to read from. Restricts gcalcli to YOUR own events so
  # shared calendars (other people's standups, team OOO calendars, colleagues
  # subscribed for awareness) don't clutter the brief.
  primary_calendar: "lena.thome@ekko.earth"
  # For external meetings: research all named attendees, with a soft cap so
  # large group meetings don't blow up runtime. Meetings rarely exceed 10.
  external_meeting_attendee_cap: 10
  # Path used by gcalcli for OAuth credentials. Default usually fine.
  gcalcli_oauth_path: "~/.gcalcli_oauth"
  # Personal contacts outside the ekko domain (old colleagues, friends). A
  # meeting with only these people plus ekko colleagues is not external, so it
  # gets no company research and no prep block.
  internal_contacts: []
  # Recurring events that are personal, never external meeting prep, whatever
  # else is invited. An event matches when its title contains `title`
  # (case-insensitive) and `with` is among its attendees; give either or both.
  # Keep `title` specific: "Catch up" alone would also match real client calls
  # unless `with` pins it to one person.
  personal_events:
    # NatWest bi-weekly: a catch-up with an old colleague.
    - title: "Catch up"
      with: "yaw.poku@natwest.com"

github:
  # Repos to scan for "awaiting your input" (review requests, mentions).
  # Per-project repos come from ~/product-os/projects/*.md, not here.
  ekko_repos:
    - ekko-home
    - ekko-edge-api
    - ekko-api
    - ekko-admin
    - ekko-web-mono
    - skill-forge
    - sdk-test-client

fathom:
  enabled: true
  # How many days back to scan for meetings and open action items.
  lookback_days: 7
  # Title regex used to detect internal team syncs, whose summaries feed the
  # engineering progress section: "P&E team sync" and "Knowledge share"
  # (or "Knowledge sharing"). Anchored at the start so other meetings that
  # merely mention these words are not caught.
  team_sync_title_regex: "(?i)^(p\\s*&\\s*e team sync|knowledge shar(e|ing))"
  # Your name as it would appear as an action-item owner in Fathom summaries.
  user_name: "Lena"
  # Team action item owners to surface alongside your own. Set this to people
  # whose work you might absorb or need to track (typically a manager, or a
  # tight peer). Other owners are filtered out of the team bucket. Match is
  # case-insensitive substring, so "Etienne" matches "Etienne Smith".
  # Leave empty to disable the team-actions section.
  team_action_owners:
    - Etienne

output:
  briefs_dir: "~/morning/briefs"
  # claude.ai artifact the brief page is published to every morning. Leave
  # empty for the first run; the skill prints the new URL to paste here.
  artifact_url: ""

paths:
  # Directory of per-project markdown files with YAML frontmatter.
  # See ~/product-os/projects/_template.md for the schema.
  projects_dir: "~/product-os/projects"
